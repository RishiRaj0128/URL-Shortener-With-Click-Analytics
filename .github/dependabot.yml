version: 2
updates:
  # Maintain dependencies for Maven backend
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "RishiRaj0128"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for React frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "RishiRaj0128"
    commit-message:
      prefix: "chore(deps-frontend)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(actions)"
