services:
  postgres:
    image: postgres:15-alpine
    container_name: urlshortener-postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortener-node-1
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    environment:
      SERVER_PORT: 8081
      WORKER_NODE_ID: 1
      APP_SNOWFLAKE_WORKER_ID: 1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_shortener
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_QUEUE_IMPL: redis
      APP_SECURITY_TRUSTED_PROXIES: 172.28.0.100
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortener-node-2
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    environment:
      SERVER_PORT: 8082
      WORKER_NODE_ID: 2
      APP_SNOWFLAKE_WORKER_ID: 2
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_shortener
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_QUEUE_IMPL: redis
      APP_SECURITY_TRUSTED_PROXIES: 172.28.0.100
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortener-node-3
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    environment:
      SERVER_PORT: 8083
      WORKER_NODE_ID: 3
      APP_SNOWFLAKE_WORKER_ID: 3
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_shortener
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_QUEUE_IMPL: redis
      APP_SECURITY_TRUSTED_PROXIES: 172.28.0.100
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  router:
    image: nginx:alpine
    container_name: urlshortener-router
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      - "8080:8080"
    networks:
      default:
        ipv4_address: 172.28.0.100
    volumes:
      - ./router/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
