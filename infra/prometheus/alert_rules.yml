groups:
  - name: url_shortener_alerts
    rules:
      - alert: HighRedirectLatencyP95
        expr: histogram_quantile(0.95, sum(rate(redirect_latency_seconds_bucket[1m])) by (le)) > 0.050
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redirect p95 latency exceeds 50ms (SLO breach)"
          description: "p95 redirect latency on cluster nodes is {{ $value }}s."

      - alert: HighRedirectErrorRate
        expr: (sum(rate(redirect_requests_total{status=~"5.."}[1m])) or vector(0)) / (sum(rate(redirect_requests_total[1m])) or vector(1)) > 0.02
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redirect HTTP 5xx error rate > 2%"
          description: "Cluster redirect error rate is {{ $value | humanizePercentage }}."

      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Resilience4j Circuit Breaker Tripped OPEN"
          description: "Circuit breaker {{ $labels.name }} is OPEN. Calls are failing fast or routed to fallback."

      - alert: ClickQueueDroppedEvents
        expr: click_events_dropped > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Click ingestion queue is dropping events"
          description: "RedisStreamClickChannel dropped {{ $value }} click events due to publisher backpressure."
