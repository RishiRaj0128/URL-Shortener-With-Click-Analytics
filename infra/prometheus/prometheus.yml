global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "url-shortener-cluster"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["app-1:8081", "app-2:8082", "app-3:8083"]
        labels:
          application: "url-shortener-service"
          environment: "cluster"
