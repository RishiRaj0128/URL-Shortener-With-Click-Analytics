events {
    worker_connections 1024;
}

http {
    upstream backend_nodes {
        # Passive health-aware upstream cluster (Nginx OSS)
        server app-1:8081 max_fails=1 fail_timeout=5s;
        server app-2:8082 max_fails=1 fail_timeout=5s;
        server app-3:8083 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Automatic failover retry: if target node crashes, retry next healthy replica immediately
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 4s;
            proxy_connect_timeout 150ms;
            proxy_read_timeout 3s;
        }

        location /router/health {
            return 200 '{"status":"UP","nodes":3}';
            add_header Content-Type application/json;
        }
    }
}
