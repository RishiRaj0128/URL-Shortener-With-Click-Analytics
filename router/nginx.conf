worker_processes 4;
events {
    worker_connections 1024;
}

http {
    log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time" '
                                'us="$upstream_status" uaddr="$upstream_addr" pid=$pid';

    access_log /var/log/nginx/access.log upstream_logging;

                        upstream backend_nodes {
        zone backend_nodes 64k;
        server 172.28.0.11:8081 max_fails=2 fail_timeout=5s;
        server 172.28.0.12:8082 max_fails=2 fail_timeout=5s;
        server 172.28.0.13:8083 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Automatic failover retry: if target node crashes, retry next healthy replica immediately
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 4s;
            proxy_connect_timeout 500ms;
            proxy_read_timeout 5s;
        }

        location /router/health {
            return 200 '{"status":"UP","nodes":3}';
            add_header Content-Type application/json;
        }
    }
}
